name: Import complete One Piece archive
on:
  push:
    paths:
      - 'archive/IMPORT_NOW'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack recorded research files
        run: |
          python3 - <<'PY'
          import base64, lzma, json, pathlib
          chunks = sorted(pathlib.Path('archive').glob('part*.txt'))
          assert len(chunks) == 7, f'Expected seven chunks, found {len(chunks)}'
          coded = ''.join(p.read_text().strip() for p in chunks)
          files = json.loads(lzma.decompress(base64.b64decode(coded)).decode('utf-8'))
          assert len(files) == 17, f'Expected 17 files, got {len(files)}'
          for name, body in files.items():
              p = pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(body, encoding='utf-8')
          print('Imported', len(files), 'files')
          PY
      - name: Publish and remove staging data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md MANIFEST.json analysis/ discussions/ meta/ research/
          git rm -r archive/
          git commit -m "docs: import 17-file One Piece discussion and theory archive"
          git push
